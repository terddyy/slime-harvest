<div id="bar"><div id="fill"></div></div>
<div id="status">Loading...</div>
<div id="tip"></div>
<div id="notice"></div>
</div>
<script src="$GODOT_URL"></script>
<script>
const TIPS = ["Water your crops: only wet soil grows.", "Slimes go for ripe and growing crops at night. Fence them out.", "Sleep in the farmhouse bed to skip to the next morning.", "Sell your harvest at the market stall to buy seeds and upgrades.", "Chickens and cows give eggs and milk every day.", "Gayle waters the crops by day and fights slimes at night.", "Press Tab to open your bag and your goals.", "Big slimes split in two when they die.", "Restoring buildings is how you win. Check the board sign.", "Fruit trees take a few days to grow, plant them early."];  // keep in sync with scripts/loading_tips.gd
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const loading = document.getElementById('loading');
const fill = document.getElementById('fill');
const status = document.getElementById('status');
const notice = document.getElementById('notice');
document.getElementById('tip').textContent = TIPS[Math.floor(Math.random() * TIPS.length)];

function showError(message) {
	status.style.display = 'none';
	notice.textContent = message;
	notice.style.display = 'block';
}

const missing = Engine.getMissingFeatures({ threads: $GODOT_THREADS_ENABLED });
if (missing.length !== 0) {
	showError('This browser cannot run the game. Missing: ' + missing.join(', '));
} else {
	engine.startGame({
		onProgress: (current, total) => {
			// total is 0 until the size of the .pck is known
			const ratio = total > 0 ? Math.min(current / total, 1) : 0;
			fill.style.width = (ratio * 100) + '%';
			status.textContent = total > 0 ? 'Loading... ' + Math.round(ratio * 100) + '%' : 'Loading...';
		},
	}).then(() => {
		loading.remove();
	}, (err) => {
		console.error(err);
		showError('The game could not start: ' + err.message);
	});
}
</script>
